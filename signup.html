<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MR.COFFEE - Sign Up</title>

    <link rel="stylesheet" href="stylesingup.css">
</head>
<body>
    <main class="signup-page">
        <section class="signup-image">
            <div class="image-overlay">
                <div class="brand-content">
                    <img src="aset/logo.png" alt="MR.COFFEE Logo">
                    <h1>Join MR.COFFEE.</h1>
                    <p>
                        Create your account and make every coffee moment better.
                    </p>
                </div>
            </div>
        </section>

        <section class="signup-container">
            <div class="signup-box">
                <div class="signup-header">
                    <h2>Create Account</h2>
                    <p>
                        Sign up to start your MR.COFFEE journey
                    </p>
                </div>

                <form id="signupForm">
                    <div class="form-group">
                        <label for="fullName"></label>
                        <input
                            type="text" id="fullName" name="fullName" placeholder="Enter your full name" autocomplete="name">
                        <small
                            class="error-message"
                            id="nameError"
                        ></small>
                    </div>

                    <div class="form-group">
                        <label for="email">
                            Email Address
                        </label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email">
                        <small
                            class="error-message"
                            id="emailError">
                        </small>
                    </div>

                    <div class="form-group">
                        <label for="password">
                            Password
                        </label>
                        <div class="password-wrapper">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Create a password"
                                autocomplete="new-password">
                            <button type="button" id="togglePassword" class="toggle-password" >
                                Show
                            </button>
                        </div>
                        <small class="password-hint">
                            Minimum 6 characters
                        </small>
                        <small
                            class="error-message"
                            id="passwordError" >
                        </small>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <div class="password-wrapper">
                            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" autocomplete="new-password">
                            <button type="button" id="toggleConfirmPassword" class="toggle-password" >
                                Show
                            </button>
                        </div>
                        <small
                            class="error-message"
                            id="confirmPasswordError"
                        ></small>
                    </div>

                    <div class="terms">
                        <label>
                            <input type="checkbox" id="terms">
                            <span> I agree to the
                                <a href="#"> Terms & Conditions </a>
                            </span>
                        </label>

                        <small
                            class="error-message"
                            id="termsError"
                        ></small>
                    </div>

                    <div class="signup-message" id="signupMessage">

                    </div>

                    <button type="submit" class="signup-button">
                        Create Account
                    </button>
                </form>

                <div class="login-link">
                    <p> Already have an account?
                        <a href="login.html"> Login </a>
                    </p>
                </div>
            </div>
        </section>
    </main>

    <script src="signup.js"></script>
</body>
</html>
